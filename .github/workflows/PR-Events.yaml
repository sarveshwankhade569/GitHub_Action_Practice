name: PR Lifecycle

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - closed

jobs:
  pr-info:
    runs-on: ubuntu-latest

    steps:
      - name: Event Type
        run: "echo 'Event: ${{ github.event.action }}'"

      - name: PR Title
        run: "echo 'Title: ${{ github.event.pull_request.title }}'"

      - name: PR Author
        run: "echo 'Author: ${{ github.event.pull_request.user.login }}'"

      - name: Source Branch
        run: "echo 'Source: ${{ github.head_ref }}'"

      - name: Target Branch
        run: "echo 'Target: ${{ github.base_ref }}'"

      - name: PR Merged
        if: github.event.pull_request.merged == true
        run: "echo '🎉 Pull Request was merged!'"
